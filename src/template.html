<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battleship</title>
</head>

<body>
  <main>
    <div id="background">
      <img src="./assets/battle.jpg">
    </div>
    <div id="menu" class="center-flex">
      <div id="op-sel" class="center-flex">
        <p style="font-size: 4rem;">Player Select</p>

  </main>
  <footer>
    <div id="info">
      <img src="./assets/intro-officer.png">
      <div id="info-text">
      </div>
    </div>
  </footer>


</body>

</html>
